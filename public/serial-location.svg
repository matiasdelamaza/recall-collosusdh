<!-- Diagrama esquemático (no fotográfico) de una bicicleta de descenso con la ubicación habitual del número de serie. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="serial-diagram-title serial-diagram-desc">
  <title id="serial-diagram-title">Ubicación del número de serie</title>
  <desc id="serial-diagram-desc">Esquema lateral de una bicicleta de descenso. Un círculo marca la parte inferior del cuadro, bajo la caja del pedalier, donde habitualmente está grabado el número de serie.</desc>
  <g fill="none" stroke="#0b0b0c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- ruedas -->
    <circle cx="150" cy="250" r="80" stroke="#a1a1aa"/>
    <circle cx="150" cy="250" r="62" stroke="#d9d9dd" stroke-width="2"/>
    <circle cx="500" cy="250" r="80" stroke="#a1a1aa"/>
    <circle cx="500" cy="250" r="62" stroke="#d9d9dd" stroke-width="2"/>
    <circle cx="150" cy="250" r="6" fill="#0b0b0c"/>
    <circle cx="500" cy="250" r="6" fill="#0b0b0c"/>
    <!-- cuadro -->
    <path d="M300 262 L262 148"/>                 <!-- tubo de sillín -->
    <path d="M262 148 L428 100"/>                 <!-- tubo superior -->
    <path d="M300 262 L444 136"/>                 <!-- tubo diagonal -->
    <path d="M300 262 L150 250"/>                 <!-- vaina inferior -->
    <path d="M150 250 L240 170"/>                 <!-- tirante -->
    <path d="M240 170 L262 148"/>
    <path d="M262 148 L300 262" stroke="#55555c" stroke-width="2"/> <!-- amortiguador -->
    <!-- pipa de dirección -->
    <path d="M428 100 L444 136" stroke-width="7"/>
    <!-- horquilla doble corona -->
    <path d="M436 118 L500 250"/>
    <path d="M422 122 L486 254" stroke-width="2"/>
    <path d="M420 92 L446 86"/>                   <!-- corona superior -->
    <!-- manillar / potencia -->
    <path d="M424 92 L420 72"/>
    <path d="M392 70 L450 66"/>
    <!-- sillín -->
    <path d="M262 148 L254 118"/>
    <path d="M232 118 L278 112"/>
    <!-- pedalier -->
    <circle cx="300" cy="262" r="10" fill="#ffffff"/>
  </g>
  <!-- marcador del número de serie -->
  <g>
    <circle cx="300" cy="282" r="26" fill="none" stroke="#0b0b0c" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M300 308 L300 338" stroke="#0b0b0c" stroke-width="2"/>
    <rect x="196" y="338" width="208" height="30" rx="4" fill="#0b0b0c"/>
    <text x="300" y="358" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#ffffff">NÚMERO DE SERIE</text>
  </g>
  <!-- etiqueta secundaria: pipa de dirección -->
  <g>
    <path d="M452 118 L520 96" stroke="#55555c" stroke-width="1.5"/>
    <text x="524" y="100" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#55555c">Pipa de dirección</text>
  </g>
</svg>
